<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Showroom Walkthrough</title>
    <style>body{margin:0;overflow:hidden;}
      /* LOADING OVERLAY */
#loadingOverlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.loader-container {
  text-align: center;
  color: #fff;
}

.loader-logo {
  width: 120px;
  margin-bottom: 20px;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid rgba(255,255,255,0.2);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 20px;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

.loader-text {
  font-size: 1rem;
  font-family: sans-serif;
}

    </style>
    <script type="module" crossorigin src="/assets/index-CTuGwoFu.js"></script>
  </head>
  <body>
    <div id="loadingOverlay">
    <div class="loader-container">
      <img src="logo.png" class="loader-logo" alt="Logo" />
      <div class="spinner"></div>
      <div class="loader-text">
        Please wait, we are setting up store for you
      </div>
    </div>
  </div>

  </body>
</html>
